databases:
  - name: monitoramento-db
    plan: free
    databaseName: monitoramento

services:
  - type: web
    name: monitoramento-ambiental
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: monitoramento-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.6"
